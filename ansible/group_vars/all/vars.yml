# Produce Configuration
project_name: "secure-phpmyadmin-access"

# Domains
# Domains
domain_base: "demo.okay.cm"
email: "admin@{{ domain_base }}"
pma_url: "pma.{{ domain_base }}"
jenkins_url: "jenkins.{{ domain_base }}"
auth_url: "auth.{{ domain_base }}"
sonar_url: "sonar.{{ domain_base }}"
sonar_db_password: "sonar_maviance_secure"
nginx_http_port: 80
nginx_https_port: 443

# Edge Gateway Selection
# Set to 'nginx' to deploy Nginx, or 'traefik' for Traefik, or 'none' if you already have a gateway running manually.
edge_gateway_type: "none" 
nginx_deploy_mode: "package" # "compose" or "package" (only applies if edge_gateway_type is nginx)

# Hybrid Routing Topology (Used if deploying across multiple hosts, or using Nginx)
keycloak_backend_ip: "{{ hostvars[groups['iam_keycloak'][0]]['ansible_host'] | default('127.0.0.1') }}"
oauth2proxy_backend_ip: "{{ hostvars[groups['oauth2_proxy'][0]]['ansible_host'] | default('127.0.0.1') }}"
pma_backend_ip: "{{ hostvars[groups['app_pma'][0]]['ansible_host'] | default('127.0.0.1') }}"
jenkins_backend_ip: "{{ hostvars[groups['app_jenkins'][0]]['ansible_host'] | default('127.0.0.1') }}"

# Traefik Integration (Used if Traefik is running on the same host as the containers)
traefik_network: "fintech-net"
traefik_certresolver: "myresolver"

# Versions
keycloak_version: "26.5.0"
mariadb_version: "11.2"
pma_version: "latest"
oauth2_proxy_version: "v7.6.0"

# Usernames
keycloak_admin_user: "admin"
pma_user: "pma_admin"
mbaapoh_user: "mbaapoh"

# Secrets are now in group_vars/all/vault.yml
# Use: ansible-vault edit group_vars/all/vault.yml 

# Keycloak Logic
keycloak_realm: "infrastructure"
keycloak_client_id: "pma-secure-client"
jenkins_client_id: "jenkins-secure-client"
jenkins_version: "lts"

# Nginx configuration removed as routing is now fully handled by Traefik dynamically via Docker labels.
