---
- name: Deploy Centralized Auth Gateway (OAuth2-Proxy)
  hosts: oauth2_proxy
  gather_facts: yes
  become: yes

  vars_files:
    - ../group_vars/all/common.yml
    - ../group_vars/all/deploy_oauth2proxy.yml
    - ../group_vars/all/vault.yml

  pre_tasks:
    - name: Install System Python Packages
      apt:
        name:
          - python3-pip
          - python3-docker
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

  roles:
    - role: deploy_oauth2proxy
