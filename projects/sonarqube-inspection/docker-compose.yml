services:
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube_maviance
    depends_on:
      - db
    ports:
      - "9000:9000"
    networks:
      - sonarnet
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar_maviance_secure
    volumes:
      - ./sonar-data:/opt/sonarqube/data
      - ./sonar-extensions:/opt/sonarqube/extensions
      - ./sonar-logs:/opt/sonarqube/logs

  db:
    image: postgres:17
    container_name: sonar_db
    networks:
      - sonarnet
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar_maviance_secure
      - POSTGRES_DB=sonar
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

networks:
  sonarnet:
    driver: bridge